name: 功能建议
description: 为 GDL 引擎提出新功能
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议！请描述清楚要解决的问题和使用场景。
  - type: textarea
    id: problem
    attributes:
      label: 解决的问题
      description: 这个功能解决什么痛点？没有它有什么不便？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 建议的 API 形态或实现思路（DSL 示例更佳）
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 考虑过的其他方案
