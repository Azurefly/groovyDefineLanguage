name: Bug 报告
description: 报告 GDL 引擎的缺陷
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        感谢报告 Bug！请尽量填写完整，帮助我们快速复现。
  - type: textarea
    id: desc
    attributes:
      label: 问题描述
      description: 清晰描述遇到的问题
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 最小可复现的 GDL 脚本 / API 调用
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 实际发生的情况，含报错堆栈（如有）
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 环境信息
      description: JDK 版本 / 操作系统 / GDL 版本（commit）
